[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-ai-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lauren",
    "lauren-ai[openai]",
    "msgspec>=0.18",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    # "lauren @ file:///root/python_projects/lauren-all/lauren-framework",
    # "lauren-ai[openai] @ file:///root/python_projects/lauren-all/lauren-ai",
    "httpx>=0.28.1",
    "modal>=1.4.2",
    "nox>=2026.4.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (require full app)",
    "unit: unit tests (no external dependencies)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
