[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-ai-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lauren",
    "lauren-ai[openai]",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "nox>=2024.0",
]

[tool.uv.sources]
lauren = { path = "../../../lauren-framework", editable = true }
lauren-ai = { path = "../../../lauren-ai", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (require full app)",
    "unit: unit tests (no external dependencies)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "nox>=2026.4.10",
]
