# Netlify configuration for SecureBank AI — Next.js 15 frontend.
#
# ── Required environment variables ──────────────────────────────────────────
# Set these in the Netlify UI:  Site → Configuration → Environment variables
#
#   BACKEND_URL          Full URL of the Python backend.
#                        e.g. https://<workspace>--securebank-ai-backend-web.modal.run
#
#   PAYLOAD_SECRET       HMAC-SHA256 secret shared with the backend.
#                        Must be identical to the value in the backend's Modal secret.
#                        Generate with: python3 -c 'import secrets; print(secrets.token_hex(32))'
#
#   NEXT_PUBLIC_WS_URL   WebSocket base URL for the live-event stream.
#                        This value is embedded into the client bundle at build time,
#                        so it must be set before clicking "Deploy" in the Netlify UI.
#                        e.g. wss://<workspace>--securebank-ai-backend-web.modal.run
#
# ── Optional environment variables ──────────────────────────────────────────
#
#   LLM_MODEL            Override the default model (default: openai/gpt-4o-mini).

# ── Build settings ───────────────────────────────────────────────────────────

[build]
  # npm run build expands to: NEXT_DIST_DIR=.next-build next build
  command = "npm run build"

  # Must match NEXT_DIST_DIR so Netlify finds the compiled output.
  publish = ".next-build"

[build.environment]
  NODE_VERSION  = "20"

  # next.config.ts reads NEXT_DIST_DIR to set distDir.
  # Declaring it here ensures the value is consistent even if the npm script
  # is changed or the build is triggered without running through npm.
  NEXT_DIST_DIR = ".next-build"

# ── Next.js plugin ────────────────────────────────────────────────────────────
# @netlify/plugin-nextjs handles:
#   - SSR pages → Netlify Functions
#   - App Router API routes → Netlify Functions
#   - Edge middleware → Netlify Edge Functions
#   - Static assets → Netlify CDN with automatic cache invalidation
#
# Install once locally (already included if in package.json devDependencies):
#   npm install -D @netlify/plugin-nextjs

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Cache headers ────────────────────────────────────────────────────────────
# Next.js static assets under /_next/static/ are content-hashed; cache them
# aggressively.  Netlify's plugin sets this automatically for most assets, but
# an explicit rule ensures it applies even outside the plugin's scope.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent the CDN from caching API route responses (they proxy live backend
# data and must always be fresh).

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
