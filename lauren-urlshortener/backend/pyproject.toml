[build-system]
requires = ["setuptools>=72", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-urlshortener-backend"
version = "1.0.0"
description = "URL Shortener — Lauren framework backend, no pydantic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lauren",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "lauren @ file:///root/python_projects/lauren-all/lauren-framework",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = [
    "integration: integration tests (real DB, all endpoints)",
    "e2e: end-to-end flow tests",
]
