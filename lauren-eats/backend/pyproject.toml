[build-system]
requires = ["setuptools>=72", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-eats-backend"
version = "1.0.0"
description = "Lauren Eats AI-Powered Chinese Restaurant Platform - Python Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lauren",
    "lauren-ai[openai]",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    # "lauren @ file:///root/python_projects/lauren-all/lauren-framework",
    # "lauren-ai[openai] @ file:///root/python_projects/lauren-all/lauren-ai",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "nox>=2024.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
